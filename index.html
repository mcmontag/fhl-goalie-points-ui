<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goalie Points</title>
<meta name="description" content="Goalie goals and assists in our ESPN fantasy hockey league, and what they did to the scoreboard.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%85%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<style>
  [x-cloak] { display: none !important; }
  .tabular { font-variant-numeric: tabular-nums; }
  input[type=range] { accent-color: #0284c7; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased">
<div x-data="dashboard()" class="mx-auto max-w-5xl px-4 pb-16">

  <!-- header -->
  <header class="pt-8 pb-6">
    <p class="text-sm font-medium text-sky-700 dark:text-sky-400" x-text="data ? `${data.meta.leagueName} · ${data.meta.season}` : ' '"></p>
    <h1 class="mt-1 text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Goalie Points</h1>
    <p class="mt-2 max-w-2xl text-slate-600 dark:text-slate-400">
      ESPN doesn't score goalie goals or assists, so we have a bot do it for them.
    </p>
    <div x-show="data" x-cloak class="mt-4 flex flex-wrap items-center gap-2 text-sm">
      <span class="rounded-full bg-white px-3 py-1 ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
        Goal <b class="tabular" x-text="'+' + fmt(rules.goal)"></b>
      </span>
      <span class="rounded-full bg-white px-3 py-1 ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
        Assist <b class="tabular" x-text="'+' + fmt(rules.assist)"></b>
      </span>
      <span class="text-slate-500 dark:text-slate-400" x-text="bonusSummary"></span>
      <span class="ml-auto text-slate-500 dark:text-slate-400" :title="data && new Date(data.meta.lastRunUtc).toLocaleString()" x-text="data ? 'Updated ' + ago(data.meta.lastRunUtc) : ''"></span>
    </div>
    <nav x-show="data" x-cloak class="mt-6 flex gap-1 overflow-x-auto text-sm font-medium shadow-[inset_0_-1px_0_theme(colors.slate.200)] dark:shadow-[inset_0_-1px_0_theme(colors.slate.800)]">
      <template x-for="t in tabs" :key="t.id">
        <button type="button" @click="selectTab(t.id)"
          class="whitespace-nowrap border-b-2 px-3 py-2 transition-colors"
          :class="tab === t.id ? 'border-sky-600 text-sky-700 dark:border-sky-400 dark:text-sky-300' : 'border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'"
          x-text="t.label"></button>
      </template>
    </nav>
  </header>

  <!-- loading / error -->
  <div x-show="loading" class="py-16 text-center text-slate-500">Loading…</div>
  <div x-show="error" x-cloak class="rounded-lg bg-red-50 p-4 text-red-800 ring-1 ring-red-200 dark:bg-red-950 dark:text-red-200 dark:ring-red-900">
    Couldn't load <code>data.json</code>: <span x-text="error"></span>
  </div>

  <template x-if="data">
  <main>

    <!-- audit log feed -->
    <section x-show="tab === 'feed'">
      <div class="mb-4 flex flex-wrap items-center gap-2">
        <h2 class="w-full text-lg font-semibold text-slate-900 sm:mr-auto sm:w-auto dark:text-white">Goalie points (current season)</h2>
        <template x-for="f in feedFilters" :key="f.id">
          <button type="button" @click="feedFilter = f.id; playing = null"
            class="rounded-full px-3 py-1 text-sm ring-1 transition-colors"
            :class="feedFilter === f.id ? 'bg-sky-600 text-white ring-sky-600' : 'bg-white text-slate-600 ring-slate-200 hover:bg-slate-100 dark:bg-slate-900 dark:text-slate-300 dark:ring-slate-800 dark:hover:bg-slate-800'"
            x-text="f.label"></button>
        </template>
      </div>

      <p x-show="!feed.length" class="py-8 text-center text-slate-500"
         x-text="feedFilter === 'benched' ? 'No goalie has scored while benched this season.' : 'No goalie points yet this season.'"></p>
      <ol class="space-y-3">
        <template x-for="a in feed" :key="a.id">
          <li class="rounded-xl bg-white p-4 ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800"
              :class="a.benched && 'opacity-75'">
           <div class="flex gap-4">
            <img :src="headshot(a)" :alt="a.goalieName" loading="lazy" @error="$el.src = SILHOUETTE"
                 class="h-16 w-16 flex-none rounded-full bg-slate-100 object-cover ring-1 ring-slate-200 dark:bg-slate-800 dark:ring-slate-700">
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-baseline gap-x-2">
                <p class="font-semibold text-slate-900 dark:text-white" x-text="a.goalieName"></p>
                <p class="text-sm text-slate-500 dark:text-slate-400" x-text="a.nhlTeam"></p>
              </div>
              <p class="text-slate-700 dark:text-slate-300">
                <span x-text="eventLabel(a)"></span>
                <span class="whitespace-nowrap text-slate-500 dark:text-slate-400" x-show="a.period" x-text="`· ${periodLabel(a.period)} ${a.timeInPeriod ?? ''}`"></span>
              </p>
              <p class="mt-1 text-sm">
                <span class="font-medium" x-text="a.fantasyTeamName ?? 'Unknown team'"></span>
                <span x-show="a.benched" class="ml-1 rounded bg-slate-100 px-1.5 py-0.5 text-xs font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300">on the bench, no points</span>
              </p>
              <p class="mt-1 flex flex-wrap gap-x-3 text-sm text-slate-500 dark:text-slate-400">
                <span x-text="dateLabel(a.gameDate)"></span>
                <span x-show="a.week" x-text="weekLabel(a.week)"></span>
                <button type="button" x-show="clipId(a)" @click="playing = playing === a.id ? null : a.id"
                   :aria-expanded="playing === a.id" class="font-medium text-sky-700 hover:underline dark:text-sky-400"
                   x-text="playing === a.id ? '■ Hide highlight' : '▶ Watch highlight'"></button>
                <a x-show="safeHighlight(a)" :href="safeHighlight(a)" target="_blank" rel="noopener"
                   class="text-sky-700 hover:underline dark:text-sky-400">NHL.com ↗</a>
              </p>
            </div>
            <p class="flex-none text-lg font-bold tabular"
               :class="a.benched ? 'text-slate-400 line-through decoration-2' : 'text-emerald-600 dark:text-emerald-400'"
               x-text="'+' + fmt(a.benched ? wouldBe(a) : a.pointsAdded)"></p>
           </div>
           <!-- the player only loads once someone asks for it -->
           <template x-if="playing === a.id && clipId(a)">
             <div class="mt-4 aspect-video w-full overflow-hidden rounded-lg bg-black">
               <iframe :src="embedUrl(a)" :title="`Highlight: ${a.goalieName} ${a.eventType}`" class="h-full w-full"
                 allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>
             </div>
           </template>
          </li>
        </template>
      </ol>
    </section>

    <!-- weekly matchups -->
    <section x-show="tab === 'matchups'">
      <div class="mb-4 flex flex-wrap items-center gap-3">
        <div class="w-full sm:mr-auto sm:w-auto">
          <h2 class="flex items-center gap-2 text-lg font-semibold text-slate-900 dark:text-white">
            <span x-text="weekLabel(week)"></span>
            <span class="rounded px-1.5 py-0.5 text-xs font-medium uppercase tracking-wide"
                  :class="weekFinal(week) ? 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300' : 'bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300'"
                  x-text="weekFinal(week) ? 'Final' : 'In progress'"></span>
          </h2>
          <p class="text-sm text-slate-500 dark:text-slate-400" x-text="[spanLabel(week), 'Raw vs adjusted scores'].filter(Boolean).join(' · ')"></p>
        </div>
        <div class="flex w-full items-center sm:w-auto" role="group" aria-label="Choose matchup">
          <button type="button" @click="stepWeek(-1)" :disabled="!adjacentWeek(-1)" aria-label="Previous matchup"
            class="rounded px-1.5 text-lg leading-none text-slate-500 hover:text-slate-900 disabled:opacity-30 disabled:hover:text-slate-500 dark:text-slate-400 dark:hover:text-white">‹</button>
          <template x-for="w in allWeeks" :key="w">
            <span class="relative flex min-w-0 items-center sm:flex-none" :class="[w === week ? 'flex-[1.8]' : 'flex-1', isFirstPlayoffWeek(w) && 'pl-2']">
              <span x-show="isFirstPlayoffWeek(w)" class="absolute left-1 top-1/2 h-3 w-px -translate-y-1/2 bg-slate-300 dark:bg-slate-700" aria-hidden="true"></span>
              <button type="button" @click="week = w" :disabled="!weeks.includes(w)"
                :aria-label="weekTitle(w)" :title="weekTitle(w)" :aria-current="w === week ? 'true' : null"
                :tabindex="w === week ? 0 : -1"
                @keydown.left.prevent="stepWeek(-1, true)" @keydown.right.prevent="stepWeek(1, true)"
                @keydown.home.prevent="pickWeek(weeks[0], true)" @keydown.end.prevent="pickWeek(weeks[weeks.length - 1], true)"
                class="group flex h-7 min-w-0 items-center justify-center outline-none transition-all duration-200 disabled:cursor-default sm:flex-none"
                :class="w === week ? 'flex-1 sm:w-7' : 'flex-1 sm:w-4'">
                <span class="flex-none rounded-full transition-all duration-200" :class="weekDotClass(w)"></span>
              </button>
            </span>
          </template>
          <button type="button" @click="stepWeek(1)" :disabled="!adjacentWeek(1)" aria-label="Next matchup"
            class="rounded px-1.5 text-lg leading-none text-slate-500 hover:text-slate-900 disabled:opacity-30 disabled:hover:text-slate-500 dark:text-slate-400 dark:hover:text-white">›</button>
        </div>
        <label class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400">
          <select x-model.number="week" aria-label="Matchup" class="rounded-md border-slate-300 bg-white px-2 py-1 text-slate-800 ring-1 ring-slate-200 dark:bg-slate-900 dark:text-slate-200 dark:ring-slate-700">
            <template x-for="w in weeks" :key="w">
              <option :value="w" :selected="w === week" x-text="weekLabel(w)"></option>
            </template>
          </select>
        </label>
      </div>

      <template x-for="group in cardGroups" :key="group.id">
        <div :class="group.title && 'mt-10'">
          <template x-if="group.title">
            <div class="mb-4">
              <h3 class="text-lg font-semibold text-slate-900 dark:text-white" x-text="group.title"></h3>
              <p class="text-sm text-slate-500 dark:text-slate-400" x-text="group.subtitle"></p>
            </div>
          </template>
          <p x-show="!group.items.length && group.empty" class="rounded-xl bg-white px-4 py-3 text-sm text-slate-500 ring-1 ring-slate-200 dark:bg-slate-900 dark:text-slate-400 dark:ring-slate-800" x-text="group.empty"></p>
              <div class="grid gap-3 sm:grid-cols-2">
                <template x-for="m in group.items" :key="m.id">
              <article class="rounded-xl bg-white p-4 ring-1 dark:bg-slate-900"
                       :class="m.flipped ? 'ring-2 ring-amber-400 dark:ring-amber-600' : 'ring-slate-200 dark:ring-slate-800'">
                <div class="mb-2 flex items-center gap-2 text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400">
                  <span x-text="(group.showWeek ? weekLabel(m.week) + ' · ' : '') + (m.final ? 'Final' : 'In progress')"></span>
                  <span x-show="m.playoff">· Playoffs</span>
                  <span x-show="m.flipped && !group.showWeek" class="ml-auto rounded bg-amber-100 px-1.5 py-0.5 text-amber-800 dark:bg-amber-900 dark:text-amber-200">Flipped</span>
                </div>
                <table class="w-full text-sm">
                  <thead class="text-xs text-slate-500 dark:text-slate-400">
                    <tr><th class="pb-1 text-left font-normal">Team</th><th class="pb-1 pl-3 text-right font-normal">Raw</th><th class="pb-1 pl-3 text-right font-normal">Goalie</th><th class="pb-1 pl-3 text-right font-normal">Adjusted</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="side in ['HOME', 'AWAY']" :key="side">
                      <tr :class="m.adjustedLeader === side ? 'font-semibold text-slate-900 dark:text-white' : 'text-slate-600 dark:text-slate-400'">
                        <td class="py-1 pr-2" x-text="teamOf(m, side).name"></td>
                        <td class="py-1 pl-3 text-right tabular" :class="m.rawLeader === side && 'underline decoration-slate-300 underline-offset-4 dark:decoration-slate-600'" x-text="score(teamOf(m, side).rawScore)"></td>
                        <td class="py-1 pl-3 text-right tabular"
                            :class="teamOf(m, side).adjustment ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400 dark:text-slate-600'"
                            x-text="teamOf(m, side).adjustment ? '+' + fmt(teamOf(m, side).adjustment) : '–'"></td>
                        <td class="py-1 pl-3 text-right tabular" x-text="score(teamOf(m, side).adjustedScore)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </article>
            </template>
          </div>
          <p x-show="group.id === 'week'" class="mt-3 text-xs text-slate-500 dark:text-slate-400">Bold is the adjusted leader; the underlined raw score is who led before goalie points.</p>
        </div>
      </template>
    </section>

    <!-- what-if sandbox -->
    <section x-show="tab === 'sandbox'">
      <h2 class="text-lg font-semibold text-slate-900 dark:text-white">What if goalie points were worth…</h2>
      <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">Drag the sliders to rescore every goalie point this season. Standings use completed regular-season weeks.</p>

      <div class="mt-4 grid gap-4 rounded-xl bg-white p-4 ring-1 ring-slate-200 sm:grid-cols-2 dark:bg-slate-900 dark:ring-slate-800">
        <template x-for="kind in ['goal', 'assist']" :key="kind">
          <label class="block">
            <span class="flex justify-between text-sm font-medium">
              <span x-text="kind === 'goal' ? 'Goal' : 'Assist'"></span>
              <span class="tabular" x-text="fmt(sim[kind]) + ' pts'"></span>
            </span>
            <input type="range" min="0" max="15" step="0.5" x-model.number="sim[kind]" class="mt-2 w-full">
            <span class="text-xs text-slate-500 dark:text-slate-400" x-text="'Actual: ' + fmt(rules[kind])"></span>
          </label>
        </template>
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" x-model="sim.bonuses" class="rounded">
          Keep power-play / shorthanded bonuses
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" x-model="sim.benched" class="rounded">
          Count goalies who were on the bench
        </label>
        <div class="sm:col-span-2">
          <!-- hidden (but still taking its space, so the card doesn't resize) while nothing differs from actual scoring -->
          <button type="button" @click="resetSim()" :class="simIsActual && 'invisible'" class="text-sm font-medium text-sky-700 hover:underline dark:text-sky-400">Reset to actual scoring</button>
        </div>
      </div>

      <div class="mt-6 grid gap-6 lg:grid-cols-5">
        <div class="lg:col-span-3">
          <h3 class="mb-2 font-semibold text-slate-900 dark:text-white">Standings</h3>
          <div class="overflow-x-auto rounded-xl bg-white ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
            <table class="w-full text-sm">
              <thead class="text-xs text-slate-500 dark:text-slate-400">
                <tr class="border-b border-slate-200 dark:border-slate-800">
                  <th class="px-3 py-2 text-left font-normal">#</th>
                  <th class="px-3 py-2 text-left font-normal">Team</th>
                  <th class="px-3 py-2 text-right font-normal">Record</th>
                  <th class="px-3 py-2 text-right font-normal">Points for</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(row, i) in simStandings" :key="row.id">
                  <tr class="border-b border-slate-100 last:border-0 dark:border-slate-800/60">
                    <td class="px-3 py-2 tabular">
                      <span x-text="i + 1"></span>
                      <span x-show="rankDelta(row, i) > 0" class="ml-1 text-xs text-emerald-600 dark:text-emerald-400" x-text="'▲' + rankDelta(row, i)"></span>
                      <span x-show="rankDelta(row, i) < 0" class="ml-1 text-xs text-red-600 dark:text-red-400" x-text="'▼' + -rankDelta(row, i)"></span>
                    </td>
                    <td class="px-3 py-2" x-text="row.name"></td>
                    <td class="px-3 py-2 text-right tabular">
                      <span x-text="record(row)"></span>
                      <span x-show="record(row) !== record(actualRow(row))" class="block text-xs text-slate-500 dark:text-slate-400" x-text="'actual ' + record(actualRow(row))"></span>
                    </td>
                    <td class="px-3 py-2 text-right tabular" x-text="score(row.pf)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
        <div class="lg:col-span-2">
          <h3 class="mb-2 font-semibold text-slate-900 dark:text-white">Results that would change</h3>
          <p x-show="!simChanges.length" class="rounded-xl bg-white px-4 py-3 text-sm text-slate-500 ring-1 ring-slate-200 dark:bg-slate-900 dark:text-slate-400 dark:ring-slate-800">None. Every matchup ends the same way.</p>
          <ul class="space-y-2">
            <template x-for="c in simChanges" :key="c.m.id">
              <li class="rounded-xl bg-white p-3 text-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
                <p class="text-xs text-slate-500 dark:text-slate-400" x-text="weekLabel(c.m.week) + (c.m.final ? '' : ' · in progress')"></p>
                <p>
                  <b x-text="c.winner"></b> <span x-text="c.m.final ? 'would win' : 'would lead'"></span>
                  <span class="tabular" x-text="c.line"></span>
                </p>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </section>

  </main>
  </template>

  <footer class="mt-12 text-xs text-slate-400 dark:text-slate-600">
    Not affiliated with ESPN or the NHL. Headshots and highlights © NHL.
  </footer>
</div>

<script>
const SILHOUETTE = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#cbd5e1"/>' +
  '<circle cx="32" cy="25" r="11" fill="#94a3b8"/><path d="M12 58c2-12 10-18 20-18s18 6 20 18z" fill="#94a3b8"/></svg>');

const NHL_PLAYER = "https://players.brightcove.net/6415718365001/D3UCGynRWU_default/index.html";

const STRENGTH = { ev: "", pp: "Power-play ", sh: "Shorthanded " };

function dashboard() {
  return {
    loading: true,
    error: null,
    data: null,
    tab: "feed",
    tabs: [
      { id: "feed", label: "Goalie points" },
      { id: "matchups", label: "Matchups" },
      { id: "sandbox", label: "What-if sandbox" },
    ],
    feedFilter: "scored",
    playing: null,
    feedFilters: [
      { id: "scored", label: "Scored" },
      { id: "benched", label: "Benched" },
    ],
    week: null,
    sim: { goal: 0, assist: 0, bonuses: true, benched: false },

    async init() {
      try {
        const r = await fetch("./data.json", { cache: "no-store" });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        data.adjustments ??= [];
        data.matchups ??= [];
        this.data = data;
        this.week = this.defaultWeek;
        this.resetSim();
      } catch (e) {
        this.error = e.message;
      } finally {
        this.loading = false;
      }
    },

    // switching to the feed resets its filter and switching to matchups resets the week;
    // the sandbox keeps its settings. Any open highlight video is closed.
    selectTab(id) {
      if (id === this.tab) return;
      this.tab = id;
      this.playing = null;
      if (id === "feed") this.feedFilter = "scored";
      if (id === "matchups") {
        this.week = this.defaultWeek;
        this.focusSelectedWeek();
      }
    },
    get defaultWeek() {
      const current = this.data.meta.currentWeek;
      if (this.weeks.includes(current)) return current;
      return this.weeks.length ? this.weeks[this.weeks.length - 1] : null;
    },

    // --- scoring rules ---
    get rules() {
      return this.data?.meta?.scoringRules ?? { goal: 0, assist: 0, strengthBonus: {} };
    },
    get bonusSummary() {
      const b = this.rules.strengthBonus;
      if (!b) return "";
      const parts = [];
      for (const [s, label] of [["pp", "PP"], ["sh", "SH"]]) {
        const g = b.goal?.[s], a = b.assist?.[s];
        if (g || a) parts.push(`${label} +${this.fmt(g ?? 0)}/+${this.fmt(a ?? 0)}`);
      }
      return parts.length ? `bonus (goal/assist): ${parts.join(", ")}` : "";
    },
    bonus(a) {
      return this.rules.strengthBonus?.[a.eventType]?.[a.strength] ?? 0;
    },
    wouldBe(a) {
      return (this.rules[a.eventType] ?? 0) + this.bonus(a);
    },

    // --- feed ---
    get feed() {
      const list = this.data.adjustments.filter(a => (this.feedFilter === "benched") === !!a.benched);
      return list.slice().sort((x, y) =>
        (y.timestamp ?? y.gameDate ?? "").localeCompare(x.timestamp ?? x.gameDate ?? "")
        || (y.period ?? 0) - (x.period ?? 0)
        || (y.timeInPeriod ?? "").localeCompare(x.timeInPeriod ?? ""));
    },
    headshot(a) {
      return /^https:\/\/assets\.nhle\.com\//.test(a.headshotUrl ?? "") ? a.headshotUrl : SILHOUETTE;
    },
    safeHighlight(a) {
      return /^https:\/\/([a-z0-9-]+\.)*nhl\.com\//i.test(a.highlightUrl ?? "") ? a.highlightUrl : null;
    },
    // NHL share links end in the Brightcove video id; the NHL's own player embeds it
    clipId(a) {
      const url = this.safeHighlight(a);
      return url ? (url.match(/-(\d{6,})$/) ?? [])[1] ?? null : null;
    },
    embedUrl(a) {
      return `${NHL_PLAYER}?videoId=${this.clipId(a)}&autoplay=true`;
    },
    eventLabel(a) {
      const what = a.eventType === "goal" ? "goal" : "assist";
      const s = STRENGTH[a.strength] ?? "";
      const text = s + what;
      return text.charAt(0).toUpperCase() + text.slice(1);
    },
    periodLabel(p) {
      return p <= 3 ? `P${p}` : p === 4 ? "OT" : `${p - 3}OT`;
    },

    // --- matchups ---
    get weeks() {
      return [...new Set(this.data.matchups.map(m => m.week))].sort((a, b) => a - b);
    },
    // every week of the season, played or not (falls back to the weeks we have data for)
    get allWeeks() {
      const total = this.data.meta.totalWeeks ?? Math.max(0, ...this.weeks);
      return Array.from({ length: total }, (_, i) => i + 1);
    },
    // matchup periods after the regular season are playoff rounds
    weekLabel(w) {
      const reg = this.data.meta.regularSeasonWeeks;
      return reg && w > reg ? `Playoffs, round ${w - reg}` : `Matchup ${w}`;
    },
    // a matchup's dates; it isn't always one week (breaks, playoff rounds), so show the length when longer
    spanLabel(w) {
      const span = (this.data.weeks ?? []).find(x => x.week === w);
      if (!span?.start) return "";
      const day = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
      if (!span.end) return `Since ${day(span.start)}`;
      return `${day(span.start)} – ${day(span.end)}` + (span.days > 8 ? ` · ${span.days} days` : "");
    },
    weekFinal(w) {
      const ms = this.data.matchups.filter(m => m.week === w);
      return ms.length > 0 && ms.every(m => m.final);
    },
    isFirstPlayoffWeek(w) {
      const reg = this.data.meta.regularSeasonWeeks;
      return reg && w === reg + 1 && w > 1;
    },
    weekState(w) {
      const ms = this.data.matchups.filter(m => m.week === w);
      if (!ms.length) return "future";
      if (ms.some(m => m.flipped)) return "flipped";
      return ms.every(m => m.final) ? "final" : "live";
    },
    weekTitle(w) {
      const label = { future: "not played yet", flipped: "goalie points flipped a result", final: "final", live: "in progress" };
      const span = this.spanLabel(w);
      return `${this.weekLabel(w)}: ${label[this.weekState(w)]}` + (span ? ` (${span})` : "");
    },
    weekDotClass(w) {
      const state = this.weekState(w);
      if (w === this.week) {
        // the selected week is a wider pill in its own slot, so it never crowds its neighbours
        const fill = state === "flipped" ? "bg-amber-400" : "bg-sky-600 dark:bg-sky-400";
        return `h-1.5 w-3 sm:h-2.5 sm:w-5 ${fill}`;
      }
      const fill = {
        future: "ring-1 ring-inset ring-slate-300 dark:ring-slate-700",
        flipped: "bg-amber-400",
        final: "bg-slate-400 dark:bg-slate-500",
        live: "ring-[1.5px] ring-inset ring-sky-600 dark:ring-sky-400",
      }[state];
      const hover = state === "future" ? "" : " group-hover:scale-125";
      return `h-1.5 w-1.5 sm:h-2.5 sm:w-2.5 ${fill}${hover}`;
    },
    adjacentWeek(dir) {
      const i = this.weeks.indexOf(this.week);
      return this.weeks[i + dir] ?? null;
    },
    stepWeek(dir, focus = false) {
      this.pickWeek(this.adjacentWeek(dir), focus);
    },
    pickWeek(w, focus = false) {
      if (w == null) return;
      this.week = w;
      // keyboard navigation: keep focus on the newly selected week
      if (focus) this.focusSelectedWeek();
    },
    // focus the selected week's pill (no scroll), so the arrow keys work right away
    focusSelectedWeek() {
      this.$nextTick(() => this.$root.querySelector("[aria-label='Choose matchup'] [aria-current='true']")?.focus({ preventScroll: true }));
    },
    get cardGroups() {
      return [
        { id: "week", items: this.weekMatchups },
        { id: "flipped", title: "Flipped matchups", subtitle: "Every matchup decided by goalie points this season",
          items: this.flipped, showWeek: true, empty: "None yet this season." },
      ];
    },
    get weekMatchups() {
      return this.data.matchups.filter(m => m.week === this.week);
    },
    get flipped() {
      return this.data.matchups.filter(m => m.flipped).sort((a, b) => b.week - a.week);
    },
    teamOf(m, side) {
      return side === "AWAY" ? m.awayTeam : m.homeTeam;
    },
    other(side) {
      return side === "HOME" ? "AWAY" : "HOME";
    },

    // --- what-if sandbox ---
    resetSim() {
      this.sim.goal = this.rules.goal ?? 0;
      this.sim.assist = this.rules.assist ?? 0;
      this.sim.bonuses = true;
      this.sim.benched = false;
    },
    get simIsActual() {
      return this.sim.goal === (this.rules.goal ?? 0) && this.sim.assist === (this.rules.assist ?? 0)
        && this.sim.bonuses && !this.sim.benched;
    },
    simValue(a) {
      if (a.benched && !this.sim.benched) return 0;
      return Number(this.sim[a.eventType] ?? 0) + (this.sim.bonuses ? this.bonus(a) : 0);
    },
    simScore(m, side) {
      const t = this.teamOf(m, side);
      // keep any non-goalie manual adjustment; swap only the goalie part
      const other = (t.adjustment ?? 0) - (t.goaliePoints ?? 0);
      const goalie = this.data.adjustments
        .filter(a => a.matchupId === m.id && a.fantasyTeamId === t.id)
        .reduce((sum, a) => sum + this.simValue(a), 0);
      return Math.round((t.rawScore + other + goalie) * 100) / 100;
    },
    leaderBy(m, scoreOf) {
      const h = scoreOf(m, "HOME"), a = scoreOf(m, "AWAY");
      return h === a ? "TIE" : h > a ? "HOME" : "AWAY";
    },
    standingsBy(scoreOf) {
      const rows = {};
      const row = t => (rows[t.id] ??= { id: t.id, name: t.name, w: 0, l: 0, t: 0, pf: 0 });
      for (const m of this.data.matchups) {
        if (!m.final || m.playoff) continue;
        const h = row(m.homeTeam), a = row(m.awayTeam);
        const hs = scoreOf(m, "HOME"), as = scoreOf(m, "AWAY");
        h.pf += hs; a.pf += as;
        if (hs > as) { h.w++; a.l++; } else if (as > hs) { a.w++; h.l++; } else { h.t++; a.t++; }
      }
      return Object.values(rows).sort((x, y) =>
        (y.w + y.t / 2) - (x.w + x.t / 2) || y.pf - x.pf || x.name.localeCompare(y.name));
    },
    get actualStandings() {
      return this.standingsBy((m, side) => this.teamOf(m, side).adjustedScore);
    },
    get simStandings() {
      return this.standingsBy((m, side) => this.simScore(m, side));
    },
    actualRow(row) {
      return this.actualStandings.find(r => r.id === row.id) ?? row;
    },
    rankDelta(row, i) {
      return this.actualStandings.findIndex(r => r.id === row.id) - i;
    },
    record(r) {
      return `${r.w}-${r.l}` + (r.t ? `-${r.t}` : "");
    },
    get simChanges() {
      const sim = (m, side) => this.simScore(m, side);
      return this.data.matchups
        .filter(m => this.leaderBy(m, sim) !== m.adjustedLeader)
        .sort((a, b) => b.week - a.week)
        .map(m => {
          const lead = this.leaderBy(m, sim);
          if (lead === "TIE") {
            return { m, winner: "Nobody", line: `(tie at ${this.score(sim(m, "HOME"))})` };
          }
          const win = this.teamOf(m, lead), lose = this.teamOf(m, this.other(lead));
          return {
            m,
            winner: win.name,
            line: `${this.score(sim(m, lead))}–${this.score(sim(m, this.other(lead)))} over ${lose.name}`,
          };
        });
    },

    // --- formatting ---
    fmt(n) {
      return Number(n ?? 0).toFixed(2).replace(/\.?0+$/, "");
    },
    score(n) {
      return Number(n ?? 0).toFixed(2);
    },
    dateLabel(d) {
      if (!d) return "";
      return new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    },
    ago(iso) {
      const mins = Math.round((Date.now() - new Date(iso)) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.round(mins / 60);
      if (hrs < 48) return `${hrs} hr ago`;
      return `${Math.round(hrs / 24)} days ago`;
    },
  };
}
</script>
</body>
